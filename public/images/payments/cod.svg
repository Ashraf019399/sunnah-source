<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" width="160" height="36" fill="none">
  <!-- Truck Icon & Delivery Badge -->
  <g transform="translate(6, 6)">
    <!-- Delivery Van Body -->
    <rect x="0" y="3" width="15" height="15" rx="2" fill="#047857" />
    <path d="M15 7H19.5L23 11V18H15V7Z" fill="#059669" />
    <!-- Window -->
    <path d="M16 8.5H19L21.5 11.5H16V8.5Z" fill="#A7F3D0" />
    <!-- Wheels -->
    <circle cx="5" cy="18" r="3" fill="#064E3B" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="18" cy="18" r="3" fill="#064E3B" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="5" cy="18" r="1.2" fill="#FFFFFF" />
    <circle cx="18" cy="18" r="1.2" fill="#FFFFFF" />
    <!-- Checkmark badge on van -->
    <path d="M4 10.5L6.5 13L11 8" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Text: CASH ON DELIVERY -->
  <text x="36" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="900" fill="#064E3B" letter-spacing="0.3">CASH ON</text>
  <text x="36" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="900" fill="#047857" letter-spacing="0.3">DELIVERY</text>
  <!-- Pill Tag: COD -->
  <rect x="94" y="9" width="34" height="17" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
  <text x="111" y="21.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#047857" text-anchor="middle">COD</text>
</svg>
